# Cloudflare Worker that turns in-script feedback into GitHub issues.
# Setup steps: ../README.md
name = "crs-feedback"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Pictures, long logs and rate-limit counters. Create it with
#   npx wrangler kv namespace create FEEDBACK
# and paste the id it prints here.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "PASTE-KV-ID-HERE"

# Burst protection: at most 5 reports per minute from one IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The GitHub token is a secret, never in this file:
#   npx wrangler secret put GITHUB_TOKEN
