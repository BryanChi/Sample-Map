name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install lupa pytest numpy
      - name: Lua syntax
        run: python3 tests/lua_syntax.py *.lua browser/*.lua
      - name: Python syntax
        run: python3 -m py_compile *.py
      - name: Load the browser with a stub REAPER API
        run: python3 tests/load_browser.py . 30
      - name: Unit tests
        run: pytest -q tests
